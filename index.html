<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Dictionary of Color Combinations — Sanzo Wada</title>
  <style>
/* ── Reset & base ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --gap: 1.5rem;
  --swatch-min: 160px;
  --text: #1a1a1a;
  --muted: #6b6b6b;
  --border: #e5e5e5;
  --bg: #fafaf8;
  --accent: #1a1a1a;
  --radius: 6px;
}

html {
  font-size: 15px;
  -webkit-font-smoothing: antialiased;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  color: var(--text);
  background: var(--bg);
  line-height: 1.5;
  min-height: 100vh;
}

/* ── Header ── */
.site-header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 1.25rem var(--gap) 1rem;
}

.site-header h1 {
  font-size: 1.1rem;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.subtitle {
  font-size: 0.8rem;
  color: var(--muted);
  margin-top: 0.15rem;
}

/* ── Controls ── */
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-top: 0.85rem;
  align-items: center;
}

.filter-group {
  display: flex;
  gap: 2px;
}

.filter-btn {
  font-size: 0.75rem;
  font-family: inherit;
  padding: 0.35rem 0.75rem;
  border: 1px solid var(--border);
  background: #fff;
  color: var(--text);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}

.filter-btn:first-child { border-radius: var(--radius) 0 0 var(--radius); }
.filter-btn:last-child  { border-radius: 0 var(--radius) var(--radius) 0; }
.filter-btn:only-child   { border-radius: var(--radius); }

.filter-btn:hover   { background: #f0f0f0; }
.filter-btn.active  { background: var(--accent); color: #fff; border-color: var(--accent); }

#search {
  font-size: 0.8rem;
  font-family: inherit;
  padding: 0.35rem 0.6rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: #fff;
  outline: none;
  width: 180px;
  transition: border-color 0.15s;
}

#search:focus { border-color: var(--accent); }

/* ── Grid ── */
.combo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 2px;
  padding: 0;
}

/* ── Card ── */
.combo-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: box-shadow 0.2s;
}

.combo-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.08); }

.combo-card .swatch-stack {
  display: flex;
  flex-direction: column;
}

.combo-card .swatch-bar {
  min-height: var(--swatch-min);
  display: flex;
  align-items: flex-end;
  padding: 0.9rem 1rem;
  position: relative;
}

.combo-card .swatch-bar .swatch-label {
  font-size: 0.78rem;
  font-weight: 500;
  color: inherit;
}

/* ── Swatch text contrast ── */
.combo-card .swatch-bar .swatch-label.on-light { color: #1a1a1a; }
.combo-card .swatch-bar .swatch-label.on-dark  { color: #fafaf8; }

/* ── Card info ── */
.combo-card .card-info {
  padding: 0.7rem 1rem 0.85rem;
  border-top: 1px solid var(--border);
}

.combo-card .combo-number {
  font-size: 0.7rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 0.35rem;
}

.combo-card .color-names {
  font-size: 0.82rem;
  font-weight: 500;
}

.combo-card .cmyk-line,
.combo-card .cmyk-inline {
  font-size: 0.72rem;
  color: var(--muted);
  margin-top: 0.1rem;
  font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
}

/* ── Clickable colour names (filter by colour) ── */
.color-name-link {
  font: inherit;
  font-weight: 600;
  background: none;
  border: none;
  padding: 0;
  color: inherit;
  cursor: pointer;
  text-decoration: underline;
  text-decoration-color: transparent;
  text-underline-offset: 2px;
  transition: text-decoration-color 0.15s;
}

.color-name-link:hover,
.color-name-link:focus-visible {
  text-decoration-color: currentColor;
}

/* ── Keyboard focus ── */
.combo-card:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.filter-btn:focus-visible,
.index-toggle:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* ── Expand ── */
.combo-card.expanded {
  grid-column: 1 / -1;
  cursor: default;
  box-shadow: 0 2px 20px rgba(0,0,0,0.1);
}

.combo-card.expanded .swatch-stack {
  flex-direction: row;
  min-height: 380px;
}

.combo-card.expanded .swatch-bar {
  flex: 1;
  min-height: 380px;
  align-items: flex-start;
}

.combo-card.expanded .swatch-bar .swatch-label {
  writing-mode: horizontal-tb;
}

.combo-card.expanded .detail-panel {
  padding: 1.25rem 1.5rem;
}

.combo-card.expanded .detail-panel h3 {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
  margin-bottom: 0.6rem;
}

.combo-card.expanded .color-detail {
  margin-bottom: 1rem;
}

.combo-card.expanded .color-detail .name {
  font-weight: 600;
  font-size: 0.95rem;
}

.combo-card.expanded .color-detail .meta {
  font-size: 0.8rem;
  color: var(--muted);
}

.combo-card.expanded .related-strip {
  display: flex;
  gap: 2px;
  margin-top: 0.5rem;
}

.combo-card.expanded .related-strip a {
  flex: 1;
  height: 24px;
  border-radius: 3px;
  text-decoration: none;
  transition: opacity 0.15s;
}

.combo-card.expanded .related-strip a:hover { opacity: 0.75; }

/* ── Index sidebar ── */
.index-toggle {
  position: fixed;
  right: var(--gap);
  bottom: var(--gap);
  z-index: 20;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: #fff;
  font-size: 1.1rem;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  transition: background 0.15s;
}

.index-toggle:hover { background: #f0f0f0; }

.index-panel {
  position: fixed;
  top: 0;
  right: 0;
  width: 340px;
  max-width: 90vw;
  height: 100vh;
  background: #fff;
  border-left: 1px solid var(--border);
  z-index: 30;
  overflow-y: auto;
  transform: translateX(100%);
  transition: transform 0.25s ease;
  padding: 1rem 0;
}

.index-panel.open { transform: translateX(0); }

.index-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.2);
  z-index: 25;
  display: none;
}

.index-overlay.show { display: block; }

.index-panel .index-item {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.35rem 1rem;
  cursor: pointer;
  transition: background 0.1s;
  text-decoration: none;
  color: var(--text);
}

.index-panel .index-item:hover { background: #f5f5f5; }

.index-panel .index-num {
  font-size: 0.65rem;
  color: var(--muted);
  width: 28px;
  text-align: right;
  flex-shrink: 0;
}

.index-panel .index-bar {
  flex: 1;
  height: 14px;
  border-radius: 2px;
  display: flex;
  overflow: hidden;
}

.index-panel .index-bar span { flex: 1; }

/* ── Footer ── */
.site-footer {
  text-align: center;
  padding: 3rem var(--gap);
  font-size: 0.72rem;
  color: var(--muted);
  border-top: 1px solid var(--border);
  margin-top: 2rem;
}

/* ── Empty / no results ── */
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 6rem var(--gap);
  color: var(--muted);
  font-size: 0.9rem;
}

/* ── Responsive ── */
@media (max-width: 700px) {
  .combo-grid { grid-template-columns: 1fr; }
  :root { --swatch-min: 120px; }
  .combo-card.expanded .swatch-stack { flex-direction: column; min-height: auto; }
  .combo-card.expanded .swatch-bar { min-height: 180px; }
}

  </style>
</head>

  <p class="subtitle">Sanzo Wada · 348 combinations</p>

    <input type="search" id="search" placeholder="Search by name…" autocomplete="off">

</header>

// ── Colour Combinations — Sanzo Wada ──
// Zero dependencies, plain ES modules.

// ── Data ──
let colours = { meta: {}, colors: [], combinations: [] };
let activeSize = 'all';


// ── Luminance & contrast ──
function relativeLuminance(r, g, b) {
  const toSRGB = (v) => {
    v /= 255;
    return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  };
  return 0.2126 * toSRGB(r) + 0.7152 * toSRGB(g) + 0.0722 * toSRGB(b);
}

function textClass(hex) {
  // hex without # -> parse
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  const lum = relativeLuminance(r, g, b);
  // White text on dark, black text on light. Threshold around 0.5
  return lum < 0.45 ? 'on-dark' : 'on-light';
}

// ── Lookups ──
const colorMap = new Map(); // id -> color object

function initLookups() {
  for (const c of colours.colors) {
    colorMap.set(c.id, c);
  }
  for (const combo of colours.combinations) {
    combo._hexes = combo.colorIds.map(id => colorMap.get(id).hex);
  }
}

// ── Query ──
function getCombo(id) {
  return colours.combinations.find(c => c.id === id);
}

// ── Render ──
const grid = document.getElementById('grid');
const searchInput = document.getElementById('search');

function renderAll() {
  const query = searchInput.value.toLowerCase().trim();

  const filtered = colours.combinations.filter(combo => {
    // Size filter
    if (activeSize !== 'all' && combo.colorIds.length !== parseInt(activeSize)) return false;

    // Search filter
    if (query) {
      const names = combo.colorIds.map(id => colorMap.get(id).name.toLowerCase());
      if (!names.some(n => n.includes(query))) return false;
    }

    return true;
  });

  grid.innerHTML = '';

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state">No combinations match. Try a different filter or search term.</div>';
    return;
  }

  for (const combo of filtered) {
    grid.appendChild(renderCard(combo));
  }
}

function renderCard(combo) {
  const card = document.createElement('div');
  card.className = 'combo-card';
  card.id = `combo-${combo.id}`;
  card.tabIndex = 0;

    const c = colorMap.get(id);
    return `<button type="button" class="color-name-link" data-name="${c.name}">${c.name}</button> <span class="cmyk-inline">C:${c.cmyk[0]} M:${c.cmyk[1]} Y:${c.cmyk[2]} K:${c.cmyk[3]}</span>`;
  });

    const c = colorMap.get(id);
    const hex = c.hex;
    const cls = textClass(hex);
    return `<div class="swatch-bar" style="background:${hex}">
      <span class="swatch-label ${cls}">${c.name}</span>
    </div>`;
  }).join('');

  card.innerHTML = `
    <div class="swatch-stack">
      ${swatchBars}
    </div>
    <div class="card-info">
      <div class="combo-number">Combination #${combo.id} · ${combo.colorIds.length} colours</div>
      <div class="color-names">${names.join(' · ')}</div>
    </div>
  `;

  // Click to expand (or filter by colour, if a colour name was clicked)
  card.addEventListener('click', (e) => {
    const nameLink = e.target.closest('.color-name-link');
    if (nameLink) {
      e.stopPropagation();
      searchInput.value = nameLink.dataset.name;
      renderAll();
      searchInput.focus();
      return;
    }
    // Don't expand if clicking on an already-expanded card (let the user scroll)
    if (card.classList.contains('expanded')) return;
    expandCard(combo, card);
  });

  // Keyboard activation (Enter / Space) mirrors click, since the card is a
  // non-native "button" for accessibility.
  card.addEventListener('keydown', (e) => {
    if (e.target.closest('.color-name-link, .related-strip a, #close-detail')) return;
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      if (card.classList.contains('expanded')) return;
      expandCard(combo, card);
    }
  });

  return card;
}

function expandCard(combo, card) {
  // Collapse any existing expanded card
  const prev = document.querySelector('.combo-card.expanded');
  if (prev) {
    prev.classList.remove('expanded');
    prev.setAttribute('aria-expanded', 'false');
    const prevPanel = prev.querySelector('.detail-panel');
    if (prevPanel) prevPanel.remove();
  }

  card.classList.add('expanded');
  card.setAttribute('aria-expanded', 'true');

  // Add detail panel
  const detailPanel = document.createElement('div');
  detailPanel.className = 'detail-panel';

  const colorDetails = combo.colorIds.map(id => {
    const c = colorMap.get(id);
    return `
      <div class="color-detail">
        <button type="button" class="name color-name-link" data-name="${c.name}">${c.name}</button>
        <div class="meta">CMYK(${c.cmyk.join(', ')}) &nbsp;·&nbsp; ${c.hex}</div>
      </div>
    `;
  }).join('');

  // Related combinations (exclude self), ranked by how many colours they
  // share with this one — a combo sharing 2 colours is more "related" than
  // one sharing just 1, so it should surface first rather than in arbitrary
  // Set-insertion order.
  const relatedCounts = new Map(); // combo id -> shared colour count
  for (const cid of combo.colorIds) {
    const c = colorMap.get(cid);
    for (const rid of c.combinations) {
      if (rid === combo.id) continue;
      relatedCounts.set(rid, (relatedCounts.get(rid) || 0) + 1);
    }
  }
  const rankedRelatedIds = [...relatedCounts.entries()]
    .sort((a, b) => b[1] - a[1])
    .map(([id]) => id)
    .slice(0, 20);

  // Render related as color bars
  const relatedBars = rankedRelatedIds.map(rid => {
    const rc = getCombo(rid);
    if (!rc) return '';
    const shared = relatedCounts.get(rid);
    const gradient = rc._hexes.map((h, i) => {
      const pct = (i / rc._hexes.length * 100).toFixed(1);
      const next = ((i + 1) / rc._hexes.length * 100).toFixed(1);
      return `${h} ${pct}% ${next}%`;
    }).join(', ');
    const sharedLabel = shared === 1 ? '1 shared colour' : `${shared} shared colours`;
    return `<a href="#combo-${rid}" data-combo="${rid}" style="background: linear-gradient(to right, ${gradient})" title="Combination #${rid} · ${sharedLabel}"></a>`;
  }).join('');

  detailPanel.innerHTML = `
    <h3>Details</h3>
    ${colorDetails}
    ${relatedBars ? `<h3>Related combinations</h3><div class="related-strip">${relatedBars}</div>` : ''}
    <button class="filter-btn" style="margin-top:1rem" id="close-detail">Close</button>
  `;

  card.appendChild(detailPanel);

  // Close button
  detailPanel.querySelector('#close-detail').addEventListener('click', (e) => {
    e.stopPropagation();
    card.classList.remove('expanded');
    card.setAttribute('aria-expanded', 'false');
    detailPanel.remove();
  });

  // Related bar clicks
  detailPanel.querySelectorAll('.related-strip a').forEach(a => {
    a.addEventListener('click', (e) => {
      e.stopPropagation();
      const targetId = parseInt(a.dataset.combo);
      const targetCombo = getCombo(targetId);
      const targetCard = document.getElementById(`combo-${targetId}`);
      if (targetCard && targetCombo) {
        card.classList.remove('expanded');
        detailPanel.remove();
        targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setTimeout(() => expandCard(targetCombo, targetCard), 400);
      }
    });
  });

  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// ── Index panel ──
function buildIndex() {
  // Create toggle button
  const toggle = document.createElement('button');
  toggle.className = 'index-toggle';
  toggle.textContent = '≡';
  toggle.title = 'Show all combinations';
  toggle.setAttribute('aria-label', 'Show all combinations');
  document.body.appendChild(toggle);

  // Create overlay
  const overlay = document.createElement('div');
  overlay.className = 'index-overlay';
  document.body.appendChild(overlay);

  // Create panel
  const panel = document.createElement('nav');
  panel.className = 'index-panel';
  panel.innerHTML = '<h2 style="font-size:0.9rem;padding:0.5rem 1rem 1rem;font-weight:600">All combinations</h2>';

  const list = document.createElement('div');
  for (const combo of colours.combinations) {
    const item = document.createElement('a');
    item.className = 'index-item';
    item.href = `#combo-${combo.id}`;
    const names = combo.colorIds.map(id => colorMap.get(id).name);
    item.setAttribute('aria-label', `Combination ${combo.id}: ${names.join(', ')}`);
    const barSpans = combo.colorIds.map(id => {
      const c = colorMap.get(id);
      return `<span style="background:${c.hex}" title="${c.name}"></span>`;
    }).join('');
    item.innerHTML = `
      <span class="index-num">${combo.id}</span>
      <span class="index-bar">${barSpans}</span>
    `;
    item.addEventListener('click', (e) => {
      e.preventDefault();
      closeIndex();
      const targetCard = document.getElementById(`combo-${combo.id}`);
      if (targetCard) {
        targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        setTimeout(() => expandCard(combo, targetCard), 400);
      }
    });
    list.appendChild(item);
  }
  panel.appendChild(list);
  document.body.appendChild(panel);

  // Toggle logic
  function openIndex() {
    panel.classList.add('open');
    overlay.classList.add('show');
  }
  function closeIndex() {
    panel.classList.remove('open');
    overlay.classList.remove('show');
  }

  toggle.addEventListener('click', openIndex);
  overlay.addEventListener('click', closeIndex);

  // Close on Escape
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeIndex();
  });
}

// ── Init ──
function init() {
  colours = COLOURS_DATA;
  initLookups();

  // Subtitle reflects whatever data is actually loaded, so it can't drift
  // out of sync if the dataset changes.
  const subtitle = document.querySelector('.subtitle');
  if (subtitle && colours.meta) {
    subtitle.textContent = `Sanzo Wada · ${colours.meta.totalCombinations} combinations`;
  }

  // Size filter handlers
  document.getElementById('size-filters').addEventListener('click', (e) => {
    if (!e.target.classList.contains('filter-btn')) return;
    document.querySelectorAll('#size-filters .filter-btn').forEach(b => {
      b.classList.remove('active');
      b.setAttribute('aria-pressed', 'false');
    });
    e.target.classList.add('active');
    e.target.setAttribute('aria-pressed', 'true');
    activeSize = e.target.dataset.size;
    renderAll();
  });

  // Search handler
  searchInput.addEventListener('input', renderAll);

  // Keyboard shortcut for index
  document.addEventListener('keydown', (e) => {
    if (e.key === 'i' && e.metaKey) {
      e.preventDefault();
      document.querySelector('.index-toggle')?.click();
    }
  });

  // Initial render
  renderAll();
  buildIndex();

  // Deep-linking: #combo-42 in the URL should land on an *expanded* card,
  // not just scroll to a collapsed one — otherwise a shared link is a worse
  // experience than browsing manually.
  handleDeepLink();
  window.addEventListener('hashchange', handleDeepLink);
}

function handleDeepLink() {
  const match = location.hash.match(/^#combo-(\d+)$/);
  if (!match) return;
  const id = parseInt(match[1], 10);
  const combo = getCombo(id);
  if (!combo) return;

  // If the current size filter would hide this combo, reset to "All" so
  // the link actually resolves to something instead of silently failing.
  if (activeSize !== 'all' && combo.colorIds.length !== parseInt(activeSize)) {
    activeSize = 'all';
    document.querySelectorAll('#size-filters .filter-btn').forEach(b => {
      b.classList.remove('active');
      b.setAttribute('aria-pressed', 'false');
    });
    const allBtn = document.querySelector('#size-filters [data-size="all"]');
    allBtn.classList.add('active');
    allBtn.setAttribute('aria-pressed', 'true');
    searchInput.value = '';
    renderAll();
  }

  const card = document.getElementById(`combo-${id}`);
  if (card) {
    card.scrollIntoView({ behavior: 'auto', block: 'center' });
    expandCard(combo, card);
  }
}

init();

</script>
</body>
